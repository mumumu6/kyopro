[tasks.cpp]
description = "必要ならコンパイルして実行"
alias = "r"
shell = "bash -c"
dir = "{{cwd}}"
quiet = true
usage = '''
arg "<src>" help="source file"
'''
run = '''
set -eu

SRC="${usage_src}"

STEM="$(basename "${SRC%.*}")"
OUT_DIR="out"
BIN="${OUT_DIR}/${STEM}"

FLAGS=(
  -fsanitize=undefined,address
  -fno-sanitize-recover=all
  -fdiagnostics-color=always
  -Wall
  -Wextra
  -Wno-sign-compare
  -std=gnu++23
  -g
  -fno-omit-frame-pointer
)

mkdir -p "$OUT_DIR"


if [ ! -f "$BIN" ] || [ ! "$BIN" -nt "$SRC" ]; then
  echo "[build] $SRC -> $BIN"
  /usr/bin/g++-14 "${FLAGS[@]}" "$SRC" -o "$BIN"
else
  echo "[skip]"
fi

"./$BIN"
'''

[tasks.cpp-build]
description = "必要ならコンパイルのみ（デバッグ用）"
alias = "cb"
shell = "bash -c"
dir = "{{cwd}}"
quiet = true
usage = '''
arg "<src>" help="source file"
'''
run = '''
set -eu

SRC="${usage_src}"

STEM="$(basename "${SRC%.*}")"
OUT_DIR="out"
BIN="${OUT_DIR}/${STEM}"

FLAGS=(
  -fsanitize=undefined,address
  -fno-sanitize-recover=all
  -fdiagnostics-color=always
  -Wall
  -Wextra
  -Wshadow
  -std=gnu++23
  -g
  -fno-omit-frame-pointer
)

mkdir -p "$OUT_DIR"

if [ ! -f "$BIN" ] || [ ! "$BIN" -nt "$SRC" ]; then
  echo "[build] $SRC -> $BIN"
  /usr/bin/g++-14 "${FLAGS[@]}" "$SRC" -o "$BIN"
else
  echo "[skip] $BIN is up to date"
fi
'''

[tasks.setup-abc]
description = "ABC の問題テンプレート a-f を生成(mise run abc 100)"
alias = "abc"
shell = "bash -c"
dir = "{{config_root}}"
usage = '''
arg "[contest_id]" help="contest id (e.g. 422 or abc422)"
'''
run = '''
set -eu
contest_id="${usage_contest_id:-}"

if [ -z "$contest_id" ]; then
  if [ -t 0 ]; then
    read -r -p "contest id (e.g. 422): " contest_id
  else
    echo "contest_id is required (e.g. 422)" >&2
    exit 1
  fi
fi

python3 scripts/setup_abc_contest.py "$contest_id"
'''

[tasks.cpp-snippet-wsl]
description = "template.cpp を WSL から VS Code の cpp.json に上書き"
alias = "tsnip"
shell = "bash -c"
dir = "{{config_root}}"
quiet = true
run = '''
set -eu

SRC="library/template.cpp"
if [ -f .env ]; then
  set -a
  . ./.env
  set +a
fi
WINUSER="${WINUSER:-}"
if [ -z "$WINUSER" ]; then
  echo "WINUSER is required (set in .env)" >&2
  exit 1
fi
OUT="/mnt/c/Users/${WINUSER}/AppData/Roaming/Code/User/snippets/cpp.json"

if [ ! -f "$SRC" ]; then
  echo "missing: $SRC" >&2
  exit 1
fi

BODY_JSON="$(jq -R -s -c 'split("\n")' "$SRC")"
jq -n --argjson body "$BODY_JSON" \
  '{"template":{"prefix":"template","body":$body,"description":"template.cpp"}}' \
  > "$OUT"

echo "written: $OUT"
'''
